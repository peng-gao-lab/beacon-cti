[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-cti"
version = "0.1.0"
description = "BEACON: CTI knowledge-graph construction (Space-Anchoring) and cross-report consolidation from CTI reports"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "jinja2>=3.1",
    "nltk>=3.8",
    "PyYAML>=6.0",
]

[project.scripts]
beacon = "beacon.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"CTIHighLevelExtractor" = ["prompts/*.jinja"]
"CTIAugmentor" = ["prompts/*.jinja"]
"CTIAlignmentor" = ["prompts/*.jinja"]
"beacon_cost" = ["pricing/*.json"]
